services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitlily_crypto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/bitlily_crypto
      PORT: 3100
    env_file:
      - .env
    ports:
      - "3100:3100"

volumes:
  pgdata:
