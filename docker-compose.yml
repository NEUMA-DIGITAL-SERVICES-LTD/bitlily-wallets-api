services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitlily_wallets_api
      POSTGRES_USER: bitlily_wallets_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bitlily_wallets_api:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/bitlily_wallets_api
      PORT: 3100
    env_file:
      - .env
    ports:
      - "3100:3100"

  kms:
    image: tatumio/tatum-kms
    container_name: bitlily-kms
    restart: unless-stopped
    env_file:
      - .env
    command: daemon --externalUrl=http://api:3100/api/v1/kms/verify/${KMS_VERIFY_TOKEN} --chain=BTC,LTC,ETH,MATIC,TRON,SOL,BSC,DOGE --period=10
    volumes:
      - ${KMS_WALLET_FILE:?KMS_WALLET_FILE is unset — set it in .env to your .tatumrc path (see .env.example)}:/home/node/.tatumrc
    depends_on:
      - api

volumes:
  pgdata:
